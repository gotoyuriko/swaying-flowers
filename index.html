<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meadow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #0e1420;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    .overlay {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(255, 255, 255, 0.85);
      font-family: Georgia, 'Times New Roman', serif;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
    }
    .overlay h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 0.12em;
    }
    .overlay p {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.06em;
      opacity: 0.75;
      font-family: system-ui, sans-serif;
    }
    .overlay .copyright {
      margin-top: 6px;
      opacity: 0.5;
    }
    #sound-toggle {
      position: fixed;
      right: 24px;
      bottom: 20px;
      padding: 7px 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.85);
      font: 12px/1 system-ui, sans-serif;
      letter-spacing: 0.06em;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    #sound-toggle:hover,
    #sound-toggle:focus-visible {
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="overlay">
    <h1>Meadow</h1>
    <p>drag to orbit · scroll to zoom</p>
    <p class="copyright">&copy; 2026 Goto Yuriko</p>
  </div>
  <button id="sound-toggle" aria-pressed="false">♪ sound off</button>
  <script type="module" src="./main.js"></script>
</body>
</html>
